<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" width="1600" height="1090" role="img"><defs><marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#A85315"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#1A6B5C"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#1A4B6B"/></marker><marker id="arr-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#6E6E64"/></marker><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#23826F"/><stop offset="1" stop-color="#0F4A3E"/></linearGradient></defs><rect width="1600" height="1090" fill="#FAFAF7"/><text x="40" y="34" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1A1A18" text-anchor="start" >How Py Internals fits together</text><rect x="40" y="60" width="1520" height="220" rx="22" fill="#FDF0E6" /><text x="72" y="106" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#A85315" text-anchor="start" letter-spacing="2.5">1  WRITE</text><text x="212.0" y="106" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6E64" text-anchor="start" >what a contributor edits</text><rect x="100" y="120" width="640" height="130" rx="14" fill="#FFFFFF" stroke="#A85315" stroke-width="2" /><rect x="100" y="120" width="8" height="130" rx="3" fill="#A85315"/><text x="128" y="160" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" font-weight="600" fill="#A85315" text-anchor="start" >sessions/NN-topic/session.js</text><text x="128" y="194" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >Demos: the Python source and an ordered list of steps.</text><text x="128" y="221" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >Every step carries one memory snapshot and the line it explains.</text><rect x="860" y="120" width="640" height="130" rx="14" fill="#FFFFFF" stroke="#A85315" stroke-width="2" /><rect x="860" y="120" width="8" height="130" rx="3" fill="#A85315"/><text x="888" y="160" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" font-weight="600" fill="#A85315" text-anchor="start" >sessions/NN-topic/index.html</text><text x="888" y="194" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >The page shell: hero, written narrative, lab markup.</text><text x="888" y="221" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >Quiz cards with a data-answer, glossary links.</text><rect x="40" y="320" width="1520" height="450" rx="22" fill="#E6F4F1" /><text x="72" y="366" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1A6B5C" text-anchor="start" letter-spacing="2.5">2  RUN</text><text x="700" y="366" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6E64" text-anchor="start" >in the reader's browser: static files, no backend, no build step</text><rect x="100" y="400" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#1A6B5C" stroke-width="2" /><rect x="100" y="400" width="8" height="150" rx="3" fill="#1A6B5C"/><text x="128" y="440" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" font-weight="600" fill="#1A6B5C" text-anchor="start" >PJ.Core</text><text x="128" y="474" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >PJ.Session.mount() wires a lab:</text><text x="128" y="501" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >sidebar, keyboard, quizzes, progress.</text><rect x="540" y="400" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#1A6B5C" stroke-width="2" /><rect x="540" y="400" width="8" height="150" rx="3" fill="#1A6B5C"/><text x="568" y="440" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" font-weight="600" fill="#1A6B5C" text-anchor="start" >PJ.Animator</text><text x="568" y="474" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >Owns the step index and timer.</text><text x="568" y="501" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >play, pause, prev, next, speed.</text><rect x="980" y="372" width="330" height="118" rx="14" fill="#FFFFFF" stroke="#1A6B5C" stroke-width="2" /><rect x="980" y="372" width="8" height="118" rx="3" fill="#1A6B5C"/><text x="1008" y="412" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" font-weight="600" fill="#1A6B5C" text-anchor="start" >PJ.MemoryViz</text><text x="1008" y="446" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >render(snapshot): frames,</text><text x="1008" y="473" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >heap objects, refcounts.</text><rect x="980" y="512" width="330" height="118" rx="14" fill="#FFFFFF" stroke="#1A6B5C" stroke-width="2" /><rect x="980" y="512" width="8" height="118" rx="3" fill="#1A6B5C"/><text x="1008" y="552" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" font-weight="600" fill="#1A6B5C" text-anchor="start" >PJ.Syntax</text><text x="1008" y="586" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >highlightLines(): marks the</text><text x="1008" y="613" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >line this step explains.</text><rect x="1370" y="424" width="170" height="160" rx="14" fill="#FFFFFF" stroke="#1A6B5C" stroke-width="2" /><rect x="1370" y="424" width="8" height="160" rx="3" fill="#1A6B5C"/><text x="1398" y="464" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#1A6B5C" text-anchor="start" >The lab</text><text x="1398" y="498" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >code panel,</text><text x="1398" y="525" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >memory panel,</text><text x="1398" y="552" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >step dots</text><rect x="100" y="620" width="360" height="112" rx="14" fill="#FFFFFF" stroke="#6E6E64" stroke-width="2" /><rect x="100" y="620" width="8" height="112" rx="3" fill="#6E6E64"/><text x="128" y="660" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" font-weight="600" fill="#6E6E64" text-anchor="start" >localStorage</text><text x="128" y="694" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >pj_completed, pj_last</text><text x="128" y="721" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >progress stays on the device.</text><rect x="40" y="810" width="1520" height="250" rx="22" fill="#E8F0F5" /><text x="72" y="856" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1A4B6B" text-anchor="start" letter-spacing="2.5">3  PUBLISH</text><text x="237.0" y="856" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#6E6E64" text-anchor="start" >the maintainer runs it, the output is committed</text><rect x="100" y="876" width="420" height="130" rx="14" fill="#FFFFFF" stroke="#1A4B6B" stroke-width="2" /><rect x="100" y="876" width="8" height="130" rx="3" fill="#1A4B6B"/><text x="128" y="916" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="21" font-weight="600" fill="#1A4B6B" text-anchor="start" >tools/build_seo.py</text><text x="128" y="950" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >Reads each page and, through node,</text><text x="128" y="977" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >each session's steps. Pillow draws the cards.</text><rect x="610" y="866" width="560" height="168" rx="14" fill="#FFFFFF" stroke="#1A4B6B" stroke-width="2" /><rect x="610" y="866" width="8" height="168" rx="3" fill="#1A4B6B"/><text x="638" y="906" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#1A4B6B" text-anchor="start" >Generated and committed</text><text x="638" y="940" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >Head tags, Open Graph and JSON-LD per page</text><text x="638" y="967" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >assets/images/og/*.png share cards</text><text x="638" y="994" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >sitemap.xml, feed.xml, robots.txt, manifest</text><text x="638" y="1021" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >llms.txt and llms-full.txt</text><rect x="1250" y="876" width="290" height="130" rx="14" fill="#FFFFFF" stroke="#1A4B6B" stroke-width="2" /><rect x="1250" y="876" width="8" height="130" rx="3" fill="#1A4B6B"/><text x="1278" y="916" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#1A4B6B" text-anchor="start" >GitHub Pages</text><text x="1278" y="950" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >Serves the repository</text><text x="1278" y="977" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#4A4A44" text-anchor="start" >files exactly as they are.</text><path d="M420 250 L420 392" fill="none" stroke="#A85315" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><text x="436" y="316" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#A85315" text-anchor="start" >demos</text><path d="M1430 250 L1430 416" fill="none" stroke="#A85315" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><text x="1446" y="326" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#A85315" text-anchor="start" >markup to fill</text><path d="M460 475 L532 475" fill="none" stroke="#1A6B5C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><text x="496" y="462" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1A6B5C" text-anchor="middle" >creates</text><path d="M900 450 C940 450 944 432 972 432" fill="none" stroke="#1A6B5C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><path d="M900 500 C940 500 944 568 972 568" fill="none" stroke="#1A6B5C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><path d="M1310 431 C1340 431 1340 470 1362 470" fill="none" stroke="#1A6B5C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><path d="M1310 571 C1340 571 1340 540 1362 540" fill="none" stroke="#1A6B5C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><path d="M280 550 L280 612" fill="none" stroke="#6E6E64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-grey)"/><path d="M520 940 L602 940" fill="none" stroke="#1A4B6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M1170 940 L1242 940" fill="none" stroke="#1A4B6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M1455 868 L1455 592" fill="none" stroke="#1A4B6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="1439" y="740" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1A4B6B" text-anchor="end" >served to the reader</text></svg>
